hero:
  kicker: "Agentic RL for Code · Long-horizon Coding · User Experience"
  summary: >-
    I’m currently a research intern at Z.AI, where I build code agents for
    complex, long-horizon software engineering tasks through interaction,
    execution, and trial and error. I also study at Tsinghua University and
    expect to graduate in summer 2027.
  status: "Z.AI · Tsinghua University"
  location: "Beijing, China"

research:
  - index: "01"
    title: "Agentic RL for Code"
    text: >-
      Training code agents to improve through execution feedback and
      trial-and-error in realistic software environments.
    tags:
      - Reinforcement learning
      - Execution feedback
  - index: "02"
    title: "Long-horizon Coding"
    text: >-
      Building agents that plan, navigate large codebases, and complete
      multi-step software tasks across extended trajectories.
    tags:
      - Repository-level coding
      - Long-horizon tasks
  - index: "03"
    title: "User Experience"
    text: >-
      Designing code agents that understand user intent, communicate clearly,
      and make complex engineering work more effective and accessible.
    tags:
      - Human-agent interaction
      - User-centered design

